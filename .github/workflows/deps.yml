name: Deps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: yetanalytics/action-setup-env@v2
        with:
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-colossal-squuid-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-colossal-squuid-deps-

      - name: Make a POM
        run: make dependency-pom

      - name: Submit Dependency Snapshot
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          directory: target/dependency-submission
          correlator: colossal-squuid-maven
          snapshot-dependency-file-name: deps.edn
